<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Call Mistri Sewa App – Book Plumber, Electrician, Lock & Home Services in Janakpur</title>
<meta name="description" content="Browse plumbing, electrical, lock, cleaning, renovation and website services in Janakpur. Call or WhatsApp to book. Emergency help available.">
<link rel="canonical" href="https://domain.com/app/"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#c8522c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Call Mistri Sewa"><meta property="og:description" content="Home, corporate and emergency services in Janakpur."><meta property="og:type" content="website">
<style>
:root{--bg:#f6f2ef;--card:#fff;--ink:#1d1a18;--mut:#7a726c;--brand:#c8522c;--tint:#fbeae3;--line:#eadfd9;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
[data-theme=dark]{--bg:#0f0d0c;--card:#1b1816;--ink:#f3ece8;--mut:#a39a94;--tint:#2d1b14;--line:#2e2623}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{height:100%;max-width:1000px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
.top{background:var(--brand);color:#fff;padding:calc(var(--sat) + 12px) 16px 18px;border-radius:0 0 28px 28px;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill,.ib,.top select{background:#fff;color:#1d1a18;border:0;border-radius:14px;height:42px;font:600 15px inherit;font-family:inherit}
.pill{padding:0 12px}.ib{width:42px;font-size:19px;position:relative}.top select{padding:0 8px}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.hi{font-size:22px;font-weight:800;margin:14px 0 2px}.sub{opacity:.9;margin:0 0 10px;font-size:15px}
.sb{display:flex;gap:8px}.sb input{flex:1;height:46px;border:0;border-radius:14px;padding:0 14px;font:inherit;background:#fff;color:#1d1a18;min-width:0}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}h2{font-size:19px;margin:20px 0 10px}h2:first-child{margin-top:0}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.of{flex:0 0 82%;max-width:420px;scroll-snap-align:start;background:#1d1a18;color:#fff;border-radius:22px;padding:20px;min-height:130px;background-size:cover;background-position:center}
.of b{font-size:20px;display:block}.of span{opacity:.85;font-size:14px}.of:nth-child(2n){background-color:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 8px}
.cat{background:none;border:0;color:var(--ink);font:500 13px inherit;font-family:inherit;text-align:center;padding:0}
.cat i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 6px;border-radius:20px;background:var(--tint);font-size:28px;font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:active{transform:scale(.98)}.g{font-size:13px;color:var(--brand);font-weight:600}.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mut);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--tint);color:var(--brand);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600}
.pr{font-weight:800;font-size:17px;margin-top:2px}.pr s{color:var(--mut);font-weight:400;font-size:14px;margin-left:6px}
.back{background:none;border:0;color:var(--brand);font:600 16px inherit;font-family:inherit;padding:0 0 10px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(var(--sab) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px inherit;font-family:inherit;padding:6px 0;border-radius:14px}
nav button i{display:block;font-size:22px;font-style:normal}nav button.on{color:var(--brand);background:var(--tint)}
nav button.em.on{color:#fff;background:#c0262d}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}.sheet.open{display:flex}
.sp{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(var(--sab) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media(prefers-reduced-motion:reduce){.sp{animation:none}}
.sp h2{font-size:22px;margin:4px 0 8px}ul{padding-left:20px;margin:4px 0 12px}li.x{color:var(--mut)}
.f{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:0 0 8px;font:inherit;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:10px;margin-top:6px}.acts a{flex:1;text-align:center;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;color:#fff;background:var(--brand)}.acts a.wa{background:#1f9d55}
@media(min-width:700px){.of{flex-basis:44%}.sheet{align-items:center}.sp{border-radius:26px}}
</style></head><body>
<div id="app">
<div class="top"><div class="row">
<span class="pill">📍 <select id="loc" aria-label="Location" style="height:32px;background:none"><option>Janakpur</option></select></span>
<span class="row"><select id="lang" aria-label="Language"><option value="en">EN</option><option value="ne">नेपाली</option></select>
<button class="ib" id="th" aria-label="Theme">🌓</button><button class="ib" id="ofb" aria-label="Offers">🎁<i class="dot"></i></button></span></div>
<div class="hi" id="hi"></div><p class="sub" id="sub"></p>
<div class="sb"><input id="q" type="search" enterkeyhint="search" autocomplete="off"></div></div>
<main id="m"></main>
<nav id="nav"></nav></div>
<div class="sheet" id="sh"><div class="sp" id="sp"></div></div>
<noscript><h1>Call Mistri Sewa</h1><p>Plumbing, electrical, lock, cleaning, renovation and website services in Janakpur. Enable JavaScript to use the app.</p></noscript>
<script>
const WA='9779800000000',TEL='+9779800000000',$=s=>document.querySelector(s),LS=localStorage;
const UI={en:{hi:'Namaste 🙏',sub:'Search a service or pick a category.',ph:'e.g. tap is leaking, lock, website…',offers:'Offers',cats:'Categories',all:'All',back:'← Back',none:'No services found. Try another word.',inc:'Included',exc:'Not included',ph1:'Your phone number',ad:'Your address',call:'Call',wa:'WhatsApp',res:'Results',personal:'Personal',corporate:'Corporate',emergency:'Emergency',from:'Rs.',msg:'Hello Call Mistri Sewa, I want to book'},
ne:{hi:'नमस्ते 🙏',sub:'सेवा खोज्नुहोस् वा क्याटेगोरी छान्नुहोस्।',ph:'जस्तै: ट्याप चुहियो, ताला, वेबसाइट…',offers:'अफरहरू',cats:'क्याटेगोरीहरू',all:'सबै',back:'← फर्कनुहोस्',none:'सेवा भेटिएन। अर्को शब्द प्रयास गर्नुहोस्।',inc:'समावेश',exc:'समावेश छैन',ph1:'तपाईंको फोन नम्बर',ad:'तपाईंको ठेगाना',call:'कल',wa:'WhatsApp',res:'नतिजा',personal:'व्यक्तिगत',corporate:'कर्पोरेट',emergency:'आपतकालीन',from:'रु.',msg:'नमस्ते Call Mistri Sewa, म बुक गर्न चाहन्छु'}};
const ICON={personal:'🏠',corporate:'🏢',emergency:'🚨'};
let S={mode:'personal',cat:null,tag:null,q:'',lang:LS.lang||'en'},C,ALL=null,cache={};
const T=k=>UI[S.lang][k],L=o=>o[S.lang]||o.en;
const get=async f=>cache[f]||(cache[f]=await(await fetch(f)).json());
async function all(){if(ALL)return ALL;ALL=[];for(const m in C.modes)for(const c of C.modes[m]){(await get(c.file)).forEach(s=>ALL.push({...s,mode:m,cat:c.id}))}return ALL}
const card=s=>`<article class="card" tabindex="0" data-k="${s.mode}/${s.id}"><span class="g">${L(s.group)}</span><h3>${L(s.title)}</h3><p>${L(s.short)}</p><div class="tags">${L(s.tags).map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="pr">${T('from')} ${s.price.toLocaleString('en-IN')}${s.priceBefore?`<s>${T('from')} ${s.priceBefore.toLocaleString('en-IN')}</s>`:''}</div></article>`;
async function render(){
 document.documentElement.lang=S.lang;$('#hi').textContent=T('hi');$('#sub').textContent=T('sub');$('#q').placeholder=T('ph');
 $('#nav').innerHTML=['personal','corporate','emergency'].map(m=>`<button data-m="${m}" class="${m} ${m=='emergency'?'em ':''}${S.mode==m&&!S.q?'on':''}"><i>${ICON[m]}</i>${T(m)}</button>`).join('');
 let h='';const M=$('#m');
 if(S.q){const q=S.q.toLowerCase(),r=(await all()).filter(s=>JSON.stringify(s).toLowerCase().includes(q));
  h=`<h2>${T('res')} (${r.length})</h2>`+(r.length?`<div class="list">${r.map(card).join('')}</div>`:`<div class="empty">${T('none')}</div>`)}
 else if(S.cat){const c=C.modes[S.mode].find(x=>x.id==S.cat),all_=(await get(c.file)).map(s=>({...s,mode:S.mode,cat:c.id})),tags=[...new Set(all_.flatMap(s=>L(s.tags)))],
  r=all_.filter(s=>!S.tag||L(s.tags).includes(S.tag));
  h=`<button class="back" id="bk">${T('back')}</button><h2>${c.icon} ${L(c.name)}</h2><div class="chips"><button class="chip ${S.tag?'':'on'}" data-t="">${T('all')}</button>${tags.map(t=>`<button class="chip ${S.tag==t?'on':''}" data-t="${t}">${t}</button>`).join('')}</div><div class="list">${r.map(card).join('')}</div>`}
 else{h=`<h2>${T('offers')}</h2><div class="car">${C.offers.map(o=>`<div class="of" ${o.img?`style="background-image:url(${o.img})"`:''}><b>${L(o.title)}</b><span>${L(o.text)}</span></div>`).join('')}</div><h2>${T(S.mode)} · ${T('cats')}</h2><div class="cats">${C.modes[S.mode].map(c=>`<button class="cat" data-c="${c.id}"><i>${c.icon}</i>${L(c.name)}</button>`).join('')}</div>`}
 M.innerHTML=h;M.scrollTop=0}
function open(html){$('#sp').innerHTML=html;$('#sh').classList.add('open')}
const close=()=>$('#sh').classList.remove('open');
async function detail(k){const[m,id]=k.split('/'),s=(await all()).find(x=>x.mode==m&&x.id==id),ph=LS.ph||'',ad=LS.ad||'';
 open(`<span class="g">${L(s.group)}</span><h2>${L(s.title)}</h2><div class="tags">${L(s.tags).map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="pr" style="font-size:22px;margin:8px 0">${T('from')} ${s.price.toLocaleString('en-IN')}${s.priceBefore?`<s>${T('from')} ${s.priceBefore.toLocaleString('en-IN')}</s>`:''}</div><p>${L(s.detail)}</p><b>${T('inc')}</b><ul>${s.included[S.lang].map(x=>`<li>✓ ${x}</li>`).join('')}</ul><b>${T('exc')}</b><ul>${s.excluded[S.lang].map(x=>`<li class="x">✕ ${x}</li>`).join('')}</ul>
 <input class="f" id="fp" type="tel" placeholder="${T('ph1')}" value="${ph}"><input class="f" id="fa" placeholder="${T('ad')}" value="${ad}">
 <div class="acts"><a href="tel:${TEL}">📞 ${T('call')}</a><a class="wa" id="wa" href="#">💬 ${T('wa')}</a></div>`);
 const up=()=>{LS.ph=$('#fp').value;LS.ad=$('#fa').value;const t=`${T('msg')}: ${L(s.title)} (${T('from')} ${s.price}).\nPhone: ${LS.ph}\nAddress: ${LS.ad}, ${$('#loc').value}`;$('#wa').href=`https://wa.me/${WA}?text=${encodeURIComponent(t)}`};
 $('#fp').oninput=$('#fa').oninput=up;up()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-c],[data-t],[data-k],#bk,#ofb,#sh');if(!t)return;
 if(t.id=='sh'&&e.target.id=='sh')return close();
 if(t.dataset.m){S.mode=t.dataset.m;S.cat=S.tag=null;S.q='';$('#q').value='';render()}
 else if(t.dataset.c){S.cat=t.dataset.c;S.tag=null;render()}
 else if(t.dataset.t!==undefined){S.tag=t.dataset.t||null;render()}
 else if(t.dataset.k)detail(t.dataset.k);
 else if(t.id=='bk'){S.cat=null;render()}
 else if(t.id=='ofb')open(`<h2>🎁 ${T('offers')}</h2>${C.offers.map(o=>`<p><b>${L(o.title)}</b><br>${L(o.text)}</p>`).join('')}`)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if(e.key=='Enter'&&e.target.classList.contains('card'))detail(e.target.dataset.k)});
$('#q').oninput=e=>{S.q=e.target.value.trim();render()};
$('#lang').onchange=e=>{S.lang=LS.lang=e.target.value;render()};
const sth=t=>{document.documentElement.dataset.theme=t;LS.theme=t};
$('#th').onclick=()=>sth(document.documentElement.dataset.theme=='dark'?'light':'dark');
sth(LS.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));$('#lang').value=S.lang;
fetch('data/catalog.json').then(r=>r.json()).then(j=>{C=j;render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
